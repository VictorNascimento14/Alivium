<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alivium — Alívio da Dor</title>
    <meta name="description" content="Acolhimento, reflexão, cuidado e esperança — conteúdos, jornadas e um diário para cuidar de você no seu tempo." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Cor da barra do navegador no celular, nos dois temas. -->
    <meta name="theme-color" content="#f5f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c2320" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alivium" />

    <!-- Remix Icon: o conjunto `Glyph` cobre a navegação e os indicadores; o
         resto dos ícones (sol/lua do tema, fechar do modal) sai daqui. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css" />

    <script>
      // Aplica o tema antes da primeira pintura: sem isto a tela pisca clara
      // até o React montar. A lógica de verdade está em `src/ui/lib/tema.ts`;
      // o prefixo da chave é o `SLUG` de `src/ui/lib/marca.ts`.
      (function () {
        try {
          var escolhido = localStorage.getItem('alivium-tema');
          var escuro =
            escolhido === 'escuro' ||
            (escolhido !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {
          /* Sem storage ou sem matchMedia: fica o tema claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
